org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
kotlinxCoroutinesVersion=1.11.0

# Maven Central Portal publishing. Credentials and in-memory signing keys are supplied
# only by release CI/environment; ordinary builds and local publication need none.
mavenCentralPublishing=true
# Release automation must override this with -PsignAllPublications=true after
# providing an in-memory signing key. Keeping local/PR builds credential-free matters.
signAllPublications=false
mavenCentralAutomaticPublishing=false
org.gradle.configuration-cache=true
